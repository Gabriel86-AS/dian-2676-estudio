<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pruebas de progreso</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:16px auto;padding:0 16px}.ok{color:#15803d}.bad{color:#b91c1c}</style></head>
<body><h1>Pruebas de progreso</h1><p id="sum"></p><ul id="out"></ul>
<script type="module">
import { run } from './progress.test.js';
const r = run();
document.getElementById('out').innerHTML = r.map(([n, ok, m]) => `<li class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${n}${m ? ' — ' + m : ''}</li>`).join('');
document.getElementById('sum').textContent = `${r.filter(x => x[1]).length}/${r.length} pasan`;
</script></body></html>
